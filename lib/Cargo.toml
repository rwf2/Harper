[package]
name = "harper"
version = "0.0.2"
edition = "2021"
rust-version = "1.95"
authors = ["Sergio Benitez <sb@sergio.bz>"]
license = "MIT OR Apache-2.0"
description = "A library to implement SSGs."
repository = "https://github.com/rwf2/harper"
readme = "../README.md"

[features]
default = ["sass"]
sass = ["grass"]
plugins = ["mlua", "thread_local", "dep:luau0-src"]

[dependencies]
once_cell = "1.21.4"
deunicode = "1.6.2"
serde_json = "1.0.154"
jwalk = "0.9.0"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["rc", "derive"] }
toml = { version = "1.1.8", features = ["preserve_order"] }
memchr = "2.8.3"
either = "1.19.0"
grass = { version = "0.13.4", default-features = false, features = ["random"], optional = true }
pulldown-cmark = { version = "0.13.5", default-features = false, features = ["simd", "html"] }

parking_lot = "0.13.0"
dashmap = { version = "6.2.1", features = ["rayon", "inline"] } # is there a better alternative?
rustc-hash = { version = "2.1.3" }
boxcar = "0.2.14"

[dependencies.mlua]
version = "0.12.2"
features = ["send", "luau", "serde"]
optional = true

[dependencies.thread_local]
version = "1.1.10"
optional = true

[dependencies.chrono]
version = "0.4.45"
default-features = false
features = ["alloc", "std"]

[dependencies.syntect]
version = "5.3.0"
default-features = false
features = ["html", "default-syntaxes", "regex-onig", "plist-load"]

[dependencies.minijinja]
version = "3.0.3"
default-features = false
features = ["speedups", "builtins", "debug", "serde", "macros", "multi_template", "std_collections"]

[dev-dependencies]
static_assertions = "1.1.0"

[target.'cfg(false)'.dependencies]
# Luau 0.22.1 emits bytecode v13, which mlua-sys 0.13.0 rejects as text.
luau0-src = { version = "=0.22.0", optional = true }
