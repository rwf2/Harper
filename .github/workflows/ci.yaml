name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    name: "Test (${{ matrix.os }}, Rust ${{ matrix.rust }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rust: stable
          - os: ubuntu-24.04
            rust: '1.95'
          - os: macos-15
            rust: stable
          - os: windows-2025
            rust: stable
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
      - name: Test (No Default Features)
        run: cargo test -p harper --no-default-features --locked
      - name: Test (Default Features)
        run: cargo test --workspace --locked
      - name: Test (All Features)
        run: cargo test --workspace --all-features --locked
      - name: Check Packages
        if: matrix.os == 'ubuntu-24.04' && matrix.rust == 'stable'
        run: cargo publish --workspace --dry-run --all-features --locked
